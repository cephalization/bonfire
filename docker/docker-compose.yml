services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: bonfire-api:prod
    ports:
      - "3000:3000" # API (direct, for SDK)
    volumes:
      - bonfire-data:/var/lib/bonfire
      - /dev/kvm:/dev/kvm
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      NODE_ENV: production
      DATABASE_URL: /var/lib/bonfire/bonfire.db
      # The shared API key clients send as X-API-Key. NODE_ENV=production means
      # the API refuses to start unless this is set to something real.
      BONFIRE_API_KEY: ${BONFIRE_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: bonfire-web:prod
    ports:
      - "80:80" # Web UI (reverse proxy + SPA)
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bonfire-data:
    driver: local
