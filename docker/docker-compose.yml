services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: bonfire-api:prod
    ports:
      - "3000:3000" # API (direct, for SDK)
    volumes:
      - bonfire-data:/var/lib/bonfire
      - /dev/kvm:/dev/kvm
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      NODE_ENV: production
      DATABASE_URL: /var/lib/bonfire/bonfire.db
      # Signs session cookies. NODE_ENV=production means the API refuses to
      # start unless this is set to something real.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # Public URL the browser uses to reach Bonfire (the nginx `web` service).
      # Cookies and CSRF origin checks are tied to it.
      BONFIRE_URL: ${BONFIRE_URL:-http://localhost}
      # Set to "true" to let anyone who can reach the server create an account.
      # By default only the first user and invited people can sign up.
      BONFIRE_OPEN_SIGNUP: ${BONFIRE_OPEN_SIGNUP:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: bonfire-web:prod
    ports:
      - "80:80" # Web UI (reverse proxy + SPA)
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bonfire-data:
    driver: local
